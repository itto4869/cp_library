[workspace]
members = [
    "crates/algorithm",
    "crates/data_structure",
    "crates/graph",
    "crates/grid",
    "crates/math",
    "crates/utils",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "CC0-1.0"

[workspace.dependencies]
ac-library-rs = "0.2.0"
